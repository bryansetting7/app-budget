<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Répartition fixe & commissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B2430;
    --surface: #232D3D;
    --line: #384358;
    --gold: #D4A017;
    --sage: #8DA98F;
    --text: #F2EFE9;
    --text-muted: #97A2B6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; min-height: 100%; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 26px;
    margin: 0 0 6px; letter-spacing: -0.01em;
  }
  .sub { color: var(--text-muted); font-size: 14px; margin: 0 0 28px; }

  .split-field { margin-bottom: 20px; }
  .split-field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .split-input-row {
    display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 12px; width: 110px;
  }
  .split-input-row input {
    background: none; border: none; color: var(--gold); font: inherit; font-size: 17px; font-weight: 600;
    width: 100%; padding: 8px 0; -moz-appearance: textfield;
  }
  .split-input-row input:focus { outline: none; }
  .split-input-row span { color: var(--text-muted); font-size: 15px; }

  table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
  thead th {
    text-align: left; font-size: 12.5px; font-weight: 600; color: var(--text-muted);
    padding: 0 6px 10px; border-bottom: 1px solid var(--line);
  }
  th.gold { color: var(--gold); }
  th.sage { color: var(--sage); }
  td { padding: 6px; vertical-align: middle; }
  td input {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font: inherit; font-size: 15px;
  }
  td input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .row-del {
    background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 0 4px;
  }
  .row-del:hover { color: #C0574C; }
  .add-row {
    display: flex; align-items: center; gap: 6px; background: none; border: 1px dashed var(--line);
    color: var(--text-muted); border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 13.5px;
    cursor: pointer; width: 100%; justify-content: center; margin-top: 4px;
  }
  .add-row:hover { border-color: var(--gold); color: var(--gold); }

  .result {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px;
  }
  .result-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--text-muted);
  }
  .result-row:last-child { border-bottom: none; }
  .result-row strong { color: var(--text); font-weight: 600; }
  .result-row.total { padding-top: 14px; }
  .result-row.total .amt {
    font-family: 'Fraunces', serif; font-size: 20px; font-weight: 500; color: var(--text);
  }
  .result-row.logement .amt { color: var(--gold); }
  .result-row.vie .amt { color: var(--sage); }
  .note { font-size: 12px; color: var(--text-muted); margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Répartition fixe & commissions</h1>
  <p class="sub">Rentre tes montants, la répartition entre charges fixes, épargne logement et vie courante se calcule toute seule.</p>

  <div class="split-field">
    <label for="splitInput">Part des commissions vers le logement</label>
    <div class="split-input-row">
      <input type="number" id="splitInput" min="0" max="100" step="1" value="30">
      <span>%</span>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th class="sage">Fixe</th>
        <th class="gold">Commissions</th>
        <th style="width:1px"></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <button class="add-row" id="addRow" type="button">+ ajouter une ligne</button>

  <div class="result" style="margin-top:24px;">
    <div class="result-row">
      <span>Charges fixes couvertes (sur le fixe)</span>
      <span class="amt" id="outCharges">0 €</span>
    </div>
    <div class="result-row logement total">
      <span><strong>Vers Projet logement</strong> (<span id="splitLabel">30</span>% des commissions)</span>
      <span class="amt" id="outLogement">0 €</span>
    </div>
    <div class="result-row vie total">
      <span><strong>Vers Vie courante</strong></span>
      <span class="amt" id="outVie">0 €</span>
    </div>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'repartition-simple-v1';
  const CHARGES_FIXES = 167;
  const SPLIT_KEY = 'repartition-simple-split-v1';

  let rows = [];
  let split = 30;

  function load() {
    try { rows = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { rows = []; }
    if (rows.length === 0) rows = [{ rsa: '', com: '' }];
    try {
      const s = localStorage.getItem(SPLIT_KEY);
      if (s) split = parseFloat(s);
    } catch (e) {}
  }
  function saveSplit() {
    try { localStorage.setItem(SPLIT_KEY, String(split)); } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rows)); } catch (e) {}
  }
  function fmt(n) {
    return n.toLocaleString('fr-FR', { minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 }) + ' €';
  }

  function renderRows() {
    const body = document.getElementById('rows');
    body.innerHTML = rows.map((r, i) => `
      <tr>
        <td><input type="number" inputmode="decimal" placeholder="0" min="0" step="0.01" data-i="${i}" data-col="rsa" value="${r.rsa}"></td>
        <td><input type="number" inputmode="decimal" placeholder="0" min="0" step="0.01" data-i="${i}" data-col="com" value="${r.com}"></td>
        <td><button class="row-del" data-del="${i}" aria-label="Supprimer">×</button></td>
      </tr>
    `).join('');

    body.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', () => {
        const i = parseInt(inp.getAttribute('data-i'));
        const col = inp.getAttribute('data-col');
        rows[i][col] = inp.value;
        save();
        compute();
      });
    });
    body.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.getAttribute('data-del'));
        rows.splice(i, 1);
        if (rows.length === 0) rows = [{ rsa: '', com: '' }];
        save();
        renderRows();
        compute();
      });
    });
  }

  function compute() {
    const totalRsa = rows.reduce((s, r) => s + (parseFloat(r.rsa) || 0), 0);
    const totalCom = rows.reduce((s, r) => s + (parseFloat(r.com) || 0), 0);

    const chargesCouvertes = Math.min(totalRsa, CHARGES_FIXES);
    const rsaVersVie = Math.max(totalRsa - CHARGES_FIXES, 0);

    const comVersLogement = totalCom * (split / 100);
    const comVersVie = totalCom - comVersLogement;

    document.getElementById('outCharges').textContent = fmt(chargesCouvertes);
    document.getElementById('outLogement').textContent = fmt(comVersLogement);
    document.getElementById('splitLabel').textContent = split;
    document.getElementById('outVie').textContent = fmt(rsaVersVie + comVersVie);
  }

  document.getElementById('addRow').addEventListener('click', () => {
    rows.push({ rsa: '', com: '' });
    save();
    renderRows();
  });

  document.getElementById('splitInput').addEventListener('input', (e) => {
    let v = parseFloat(e.target.value);
    if (isNaN(v)) v = 0;
    v = Math.min(Math.max(v, 0), 100);
    split = v;
    saveSplit();
    compute();
  });

  load();
  document.getElementById('splitInput').value = split;
  renderRows();
  compute();
})();
</script>
</body>
</html>
